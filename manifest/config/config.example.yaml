# vgo 配置模板
# 使用方法：复制为 config.yaml 并根据环境修改；所有 ${VAR} 占位符从环境变量读取（见根目录 .env.example）。
# 密码/密钥严禁写入本文件提交仓库，一律通过环境变量注入。

server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 104857600 # 100MB in bytes 100*1024*1024

logger:
  level: "info"
  stdout: true

database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "vgov2"
    pass: "${VGO_DB_PASS}"
    name: "vgov2"
    debug: true
    createdAt: "createTime"
    updatedAt: "updateTime"

redis:
  v:
    address: "127.0.0.1:6379"
    db: 0
    pass: "${VGO_REDIS_PASS}"

v:
  autoMigrate: false
  eps: true
  file:
    mode: "local" # local | minio | oss
    domain: "http://127.0.0.1:8002"
    # oss配置项兼容 minio oss 需要配置bucket公开读
    oss:
      endpoint: "127.0.0.1:9000"
      accessKeyID: "${VGO_OSS_ACCESS_KEY_ID}"
      secretAccessKey: "${VGO_OSS_SECRET_ACCESS_KEY}"
      bucketName: "vgo"
      useSSL: false #minio用到
      location: "us-east-1" #minio用到

modules:
  base:
    jwt:
      sso: false
      token:
        expire: 10 # 2*3600
        refreshExpire: 1296000 # 24*3600*15
    middleware:
      authority:
        enable: true
      log:
        enable: true
