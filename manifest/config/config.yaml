# vgo 配置（密码/密钥经环境变量注入，见 .env；严禁写入本文件提交仓库）
server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 104857600 # 100MB in bytes 100*1024*1024

logger:
  level: "info"
  stdout: true

database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "vgov2"
    pass: "${VGO_DB_PASS}"
    name: "vgov2"
    debug: true
    createdAt: "createTime"
    updatedAt: "updateTime"

redis:
  v:
    address: "127.0.0.1:6379"
    db: 0
    pass: "${VGO_REDIS_PASS}"

v:
  autoMigrate: false
  eps: true
  file:
    mode: "local" # local | minio | oss
    domain: "http://127.0.0.1:8002"
    oss:
      endpoint: "127.0.0.1:9000"
      accessKeyID: "${VGO_OSS_ACCESS_KEY_ID}"
      secretAccessKey: "${VGO_OSS_SECRET_ACCESS_KEY}"
      bucketName: "vgo"
      useSSL: false
