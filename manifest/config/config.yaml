server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 104857600 # 100MB in bytes 100*1024*1024

logger:
  level: "info"
  stdout: true

database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "vtest"
    pass: "${VGO_DB_PASS}"
    name: "vtest"
    debug: true
    createdAt: "createTime"
    updatedAt: "updateTime"
  # default:
  #   type: "mysql"
  #   host: "127.0.0.1"
  #   port: "5433"
  #   user: "vtest"
  #   pass: "${VGO_DB_PASS}"
  #   name: "vtest"
  #   charset: "utf8mb4"
  #   timezone: "Asia/Shanghai"
  #   debug: true
  #   createdAt: "createTime"
  #   updatedAt: "updateTime"
  #   deletedAt: "deleteTime"

  # default:
  #   type: "sqlite" # 数据库类型
  #   name: "v.sqlite" # 数据库名称,对于sqlite来说就是数据库文件名
  #   extra: busy_timeout=5000 # 扩展参数 如 busy_timeout=5000&journal_mode=ALL
  #   createdAt: "createTime" # 创建时间字段名称
  #   updatedAt: "updateTime" # 更新时间字段名称
  #   debug: true # 开启调试模式,启用后将在控制台打印相关sql语句

# Redis 配置
redis:
  v:
    address: "127.0.0.1:6379"
    db: 0
    pass: "${VGO_REDIS_PASS}"

v:
  autoMigrate: false
  eps: true
  file:
    mode: "local" # local | minio | oss
    domain: "http://127.0.0.1:8002"
    # oss配置项兼容 minio oss 需要配置bucket公开读
    oss:
      endpoint: "192.168.192.110:9000"
      accessKeyID: "${VGO_OSS_ACCESS_KEY_ID}"
      secretAccessKey: "${VGO_OSS_SECRET_ACCESS_KEY}"
      bucketName: "vgo"
      useSSL: false #minio用到
      location: "us-east-1" #minio用到

modules:
  base:
    jwt:
      sso: false
      token:
        expire: 10000 # 2*3600
        refreshExpire: 1296000 # 24*3600*15
    middleware:
      authority:
        enable: true
      log:
        enable: true
