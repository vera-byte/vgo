version: "3"
services:
  # mysql8 数据库
  mysql:
    image: mysql:8
    container_name: mysql8
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请复制 .env.example 为 .env}" # 配置root用户密码
      MYSQL_DATABASE: "vtest" # 业务库名
      MYSQL_USER: "vtest" # 业务库用户名
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请复制 .env.example 为 .env}" # 业务库密码
    ports:
      - 3307:3306
    volumes:
      - ./data/mysql/:/var/lib/mysql/

  # redis 数据库
  redis:
    image: redis
    # command: --requirepass "12345678" # redis库密码,不需要密码注释本行
    # restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
    volumes:
      - ./data/redis/:/data/
    ports:
      - 6379:6379

  # PostgreSQL 数据库
  pgsql:
    image: postgres:18
    # restart: always
    environment:
      TZ: Asia/Shanghai # 指定时区
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}" # 配置root用户密码
      POSTGRES_DB: "vtest" # 业务库名
      POSTGRES_USER: "vtest" # 业务库用户名
    volumes:
      # PG 18+ 镜像要求挂载 /var/lib/postgresql 父目录（数据落在版本子目录）
      - ./data/pgsql/:/var/lib/postgresql/
    ports:
      - 5432:5432
