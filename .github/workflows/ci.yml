name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build (root, no workspace)
        run: GOWORK=off go build ./...
      - name: Vet
        run: make vet
      - name: Test
        run: make test
